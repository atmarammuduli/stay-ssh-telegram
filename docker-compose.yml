services:
  bot:
    build: .
    container_name: stayssh-bot
    restart: unless-stopped
    env_file:
      - .env
    # We use the DATABASE_URL from .env directly.
    # Note: If using a DB on the host, use 'host.docker.internal' in .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./logs:/app/logs
      - ./keys:/app/keys
      - /var/run/docker.sock:/var/run/docker.sock
