[project]
name = "stay-ssh-telegram"
version = "0.1.0"
description = "A robust SSH Telegram bot with tmux persistence and adaptive batching."
authors = [{ name = "StaySSH Team" }]
dependencies = [
    "python-telegram-bot[job-queue]>=20.0",
    "asyncssh>=2.13.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "alembic>=1.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "mypy>=1.4.0",
    "ruff>=0.0.280",
    "black>=23.7.0",
    "safety>=2.3.0",
    "xenon>=0.9.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"
select = ["E", "F", "B", "I", "N", "UP", "PL", "RUF"]

[tool.black]
line-length = 88
target-version = ['py311']

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=tmux_ssh_telegram --cov-report=term-missing"

[tool.mypy]
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.setuptools]
packages = ["tmux_ssh_telegram", "tmux_ssh_telegram.bot", "tmux_ssh_telegram.core", "tmux_ssh_telegram.db", "tmux_ssh_telegram.ssh"]
